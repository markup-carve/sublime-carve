name: CI

on:
  push:
    branches: [main, next2]
  pull_request:

# Every job declares timeout-minutes so a hung step fails in minutes
# rather than inheriting the 360-minute GitHub default.

jobs:
  syntax_tests:
    name: Syntax Tests (${{ matrix.build }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - build: stable
    steps:
      - uses: actions/checkout@v7

      - uses: SublimeText/syntax-test-action@v2
        with:
          build: ${{ matrix.build }}
          package_name: Carve
          # Fenced code embeds the real bundled syntaxes (source.python, ...),
          # so the default packages must be present for the embeds to resolve.
          # `binary` pins them to the tag closest to the tested build.
          default_packages: binary

  lint_assertions:
    name: Lint syntax-test assertions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # The syntax-test runner cannot report an assertion that cannot fail: a
      # negative marker written `- scope` instead of `-scope` is accepted and
      # checks nothing. Every negative in this repo was dead that way once.
      - name: Reject assertions that cannot fail
        run: python3 tools/lint-syntax-tests.py

      # Every fence position's language rules are generated from the vendored
      # table, so a table change without regenerating embeds nothing new.
      - name: The generated fence languages are in sync
        run: python3 tools/generate-fence-languages.py --check

      # Reaches the network, so a failure means the vendored table is stale (or
      # GitHub is down), not that the syntax is wrong.
      - name: The vendored fence-language table still matches carve-grammars
        run: ./tools/check-fence-languages-drift.sh
        env:
          CARVE_GRAMMARS_REV: 79511c4ba461cb0696e0400132da9eef414147e0

  validate:
    name: Validate Sublime syntax YAML
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate .sublime-syntax files parse as YAML
        run: |
          python - <<'PY'
          import glob
          import sys
          import yaml

          files = sorted(glob.glob("*.sublime-syntax"))
          if not files:
              sys.exit("No .sublime-syntax files found")

          for path in files:
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"OK: {path}")
          PY

      - name: Validate sidecar JSON/settings files parse
        run: |
          python - <<'PY'
          import glob
          import json
          import sys

          for path in sorted(glob.glob("*.json") + glob.glob("messages/*.json")):
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
              print(f"OK: {path}")
          PY
