name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax_tests:
    name: Syntax Tests (${{ matrix.build }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - build: stable
    steps:
      - uses: actions/checkout@v4

      - uses: SublimeText/syntax-test-action@v2
        with:
          build: ${{ matrix.build }}
          package_name: Carve
          # Fenced code embeds the real bundled syntaxes (source.python, ...),
          # so the default packages must be present for the embeds to resolve.
          # `binary` pins them to the tag closest to the tested build.
          default_packages: binary

  lint_assertions:
    name: Lint syntax-test assertions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The syntax-test runner cannot report an assertion that cannot fail: a
      # negative marker written `- scope` instead of `-scope` is accepted and
      # checks nothing. Every negative in this repo was dead that way once.
      - name: Reject assertions that cannot fail
        run: python3 tools/lint-syntax-tests.py

      # The generated battery block is a copy of carve-grammars' table, compiled
      # into this file's assertion language. A copy nothing compares is the
      # failure the battery exists to catch, one level up.
      - name: The generated battery block is in sync
        run: python3 tools/generate-battery-tests.py --check

      # Reaches the network, so a failure means the vendored table is stale (or
      # GitHub is down), not that the syntax is wrong.
      - name: The vendored block battery still matches carve-grammars
        run: ./tools/check-battery-drift.sh

  validate:
    name: Validate Sublime syntax YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate .sublime-syntax files parse as YAML
        run: |
          python - <<'PY'
          import glob
          import sys
          import yaml

          files = sorted(glob.glob("*.sublime-syntax"))
          if not files:
              sys.exit("No .sublime-syntax files found")

          for path in files:
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"OK: {path}")
          PY

      - name: Validate sidecar JSON/settings files parse
        run: |
          python - <<'PY'
          import glob
          import json
          import sys

          for path in sorted(glob.glob("*.json") + glob.glob("messages/*.json")):
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
              print(f"OK: {path}")
          PY
